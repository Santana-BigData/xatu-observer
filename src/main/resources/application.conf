num_threads = 200
num_threads = ${?NUM_THREADS}

# Name of this server, sent in telegram notifications and saved in each log
server = ${?SERVER}

api {
    host = "127.0.0.1"
    host = ${?HOST}

    port = 8089
    port = ${?PORT}

    timeout = 15000
    timeout = ${?API_TIMEOUT}

    healthcheck_timeout = 10000
    healthcheck_timeout = ${?HEALTHCHECK_TIMEOUT}

    auth {
        header=Authorization
    }
}

managers {
  enabled = true
}

_private {
  MYSQL_HOST = "127.0.0.1"
  MYSQL_HOST = ${?MYSQL_HOST}
  MYSQL_PORT = "3306"
  MYSQL_PORT = ${?MYSQL_PORT}
  MYSQL_DATABASE = "xatu"
  MYSQL_DATABASE = ${?MYSQL_DATABASE}
}

mysql {
  connectionPool = "HikariCP"
  driver = "com.mysql.cj.jdbc.Driver",
  url = "jdbc:mysql://"${_private.MYSQL_HOST}":"${_private.MYSQL_PORT}"/"${_private.MYSQL_DATABASE}
  user = "root"
  user = ${?MYSQL_USER}
  password = "root"
  password = ${?MYSQL_PASSWORD}

  numThreads = 25
  numThreads = ${?MYSQL_NUM_THREADS}
  maxConnections=25
  maxConnections=${?MYSQL_NUM_THREADS}
}

redis {
    # "standalone" or "sentinel"
    mode = "standalone"
    mode = ${?REDIS_MODE}
    host = "127.0.0.1"
    host = ${?REDIS_HOST}
    port = 6379
    port = ${?REDIS_PORT}
    password = ${?REDIS_PASSWORD}
    ttl = 300
    ttl = ${?REDIS_TTL}

    sentinel {
        master = "mymaster"
        master = ${?REDIS_SENTINEL_MASTER}
        # Comma separated list of host:port
        nodes = "127.0.0.1:26379"
        nodes = ${?REDIS_SENTINEL_NODES}
        password = ${?REDIS_SENTINEL_PASSWORD}
    }
}

elasticsearch {
    active = "true"
    active = ${?ELASTICSEARCH_ACTIVE}
    host = "http://127.0.0.1"
    host = ${?ELASTICSEARCH_HOST}
    port = 9200
    port = ${?ELASTICSEARCH_PORT}
    index = xatu-logs
    index = ${?ELASTICSEARCH_LOG_INDEX}
    # Default max number of logs returned by a search
    search_size = 500
    search_size = ${?ELASTICSEARCH_SEARCH_SIZE}
    user = ${?ELASTICSEARCH_USER}
    password = ${?ELASTICSEARCH_PASSWORD}
}

cassandra {
    # Server metrics (cpu, memory, network...) are saved in cassandra when active
    active = "false"
    active = ${?CASSANDRA_ACTIVE}
    # Comma separated list of hosts
    contact_points = "127.0.0.1"
    contact_points = ${?CASSANDRA_CONTACT_POINTS}
    port = 9042
    port = ${?CASSANDRA_PORT}
    keyspace = "xatu"
    keyspace = ${?CASSANDRA_KEYSPACE}
    datacenter = "datacenter1"
    datacenter = ${?CASSANDRA_DATACENTER}
    # Used only by cassandraMigrate when creating the keyspace
    replication_factor = 3
    replication_factor = ${?CASSANDRA_REPLICATION_FACTOR}
    timeout_ms = 5000
    timeout_ms = ${?CASSANDRA_TIMEOUT_MS}
    user = ${?CASSANDRA_USER}
    password = ${?CASSANDRA_PASSWORD}
}

metrics {
    # Seconds between two samples of cpu, memory, network...
    interval_seconds = 60
    interval_seconds = ${?METRICS_INTERVAL_SECONDS}
    # Comma separated list of network interfaces. Empty = all physical interfaces
    net_interfaces = ""
    net_interfaces = ${?METRICS_NET_INTERFACES}
    # Filesystem used for disk usage
    disk_path = "/"
    disk_path = ${?METRICS_DISK_PATH}
}

cluster {
    # Every Xatu checks its services/containers/apis and saves the result per server in redis.
    # Seconds between heartbeats and leader election rounds
    period_seconds = 10
    period_seconds = ${?CLUSTER_PERIOD_SECONDS}
    # A check or heartbeat older than this is stale (the server stopped reporting)
    status_ttl_seconds = 60
    status_ttl_seconds = ${?CLUSTER_STATUS_TTL_SECONDS}
}

telegram {
    bot_token = "inactive"
    bot_token = ${?TELEGRAM_BOT_TOKEN}
    chat_id = ${?TELEGRAM_CHAT_ID}
    # Minutes before repeating an alert that is still happening
    repeat_minutes = 30
    repeat_minutes = ${?TELEGRAM_REPEAT_MINUTES}
}

test {
  h2mem {
    url = "jdbc:h2:mem:test;MODE=MYSQL"
    driver = org.h2.Driver
    connectionPool = disabled
    keepAliveConnection = true
  }
}
